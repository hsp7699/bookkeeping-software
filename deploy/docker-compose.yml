# One small server runs everything: the app, Postgres, and Caddy for HTTPS.
# Usage (from this folder): cp .env.example .env, edit it, then `docker compose up -d --build`
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: books
      POSTGRES_USER: books
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d books"]
      interval: 5s
      retries: 10

  app:
    build: ../app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://books:${DB_PASSWORD}@db:5432/books
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://${DOMAIN}
      APP_URL: https://${DOMAIN}
      JOBS: ${JOBS:-on}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - storage:/data/storage

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  db:
  storage:
  caddy:
